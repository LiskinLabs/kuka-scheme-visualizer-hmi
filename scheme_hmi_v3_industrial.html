<!DOCTYPE HTML>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KUKA Cell Visualizer - Pro Web</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- HTML2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Roboto", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"],
                    },
                    colors: {
                        cad: {
                            bg: "#1e1e1e",
                            panel: "#2d2d30",
                            border: "#3e3e42",
                            grid: "#2a2a2a",
                            text: "#d4d4d4",
                            highlight: "#007acc",
                            line: "#569cd6",
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS (Only canvas components/variables left here) -->
    <link rel="stylesheet" href="kuka_design_system.css">

    <style>
        .all-layouts-grid {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding-bottom: 20px;
        }

        .all-layouts-grid .pallet-area {
            width: 300px;
            height: 280px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .layout-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 10px;
            text-align: center;


        }

        @media (max-width: 640px) {
            #minimapContainer { display: none !important; }
        }

        .layout-card-title {
            text-align: center;
            color: var(--kuka-orange);
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
                margin: 0;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            /* Hide UI controls */
            .side-panel,
            #leftPanel,
            #rightPanel,
            #minimapContainer,
            #contextMenu,
            .fixed.top-4,
            .fixed.bottom-4,
            #btnOpenLeft,
            #btnOpenRight {
                display: none !important;
            }

            #singleViewArea {
                width: 100% !important;
                height: 100% !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                page-break-inside: avoid !important;
                overflow: visible !important;
                background: white !important;
            }

            #palletArea {
                margin: 0 auto !important;
                page-break-inside: avoid !important;
                overflow: visible !important;
            }

            .center-panel .panel-body,
            .center-panel .panel-header,
            .panel-header {
                display: none !important;
            }

            .status-bar,
            .footer,
            .mode-selector,
            .dizilim-grid,
            .btn-primary,
            .lang-selector,
            #radPosResetBtn,
            #radPositionsPanel,
            #palletSizeControls {
                display: none !important;
            }

            /* Black & White Technical Drawing Styles */
            .pallet-area {
                background: none !important;
                border: none !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                box-shadow: none !important;
            }

            .pallet,
            .pallet2,
            .pallet-wood {
                background: #fff !important;
                border: 2px solid #000 !important;
                box-shadow: none !important;
                background-image: none !important;
            }

            .rad,
            .rad-24050,
            .rad-24050-flipped {
                border: 2px solid #000 !important;
                background: #fff !important;
                color: #000 !important;
                text-shadow: none !important;
                box-shadow: none !important;
                background-image: none !important;
            }

            .rad span,
            .rad-24050 .pkg-num,
            .rad-24050-flipped .pkg-num {
                background: none !important;
                color: #000 !important;
                font-weight: bold;
                text-shadow: none !important;
            }

            /* Remove 24050 visual details for print */
            .pkg-body, .pkg-card, .pkg-corner, .pkg-label {
                display: none !important;
            }

            /* Remove inner pattern for regular radiators */
            .heat-plate, .pattern-area, .long-pipe, .port, .clip {
                background: none !important;
                box-shadow: none !important;
                border: none !important;
            }

            .dim-w,
            .dim-h {
                color: #000 !important;
                font-weight: bold;
                font-size: 10px !important;
            }

            .blueprint-only {
                display: block !important;
            }

            .dim-line {
                border-color: #000 !important;
                border-style: dashed !important;
                border-width: 1.5px !important;
            }

            .dim-label {
                background: #fff !important;
                color: #000 !important;
                border: 1px solid #000 !important;
                box-shadow: none !important;
                font-weight: bold;
            }

            .center-mark {
                border: 1px solid #000 !important;
                background: none !important;
                box-shadow: none !important;
                animation: none !important;
            }

            .rad-overflow {
                border-color: #000 !important;
                box-shadow: none !important;
                animation: none !important;
                border-style: dashed !important;
                background: #f9f9f9 !important;
            }

            /* Make sure 'All Layouts' Grid lays out correctly on print A4 without breaking blocks */
            .all-layouts-grid {
                display: block !important;
                width: 100%;
            }

            .layout-card {
                display: inline-block;
                width: 48%;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                border: none !important;
                background: none !important;
                margin-bottom: 25px;
                margin-right: 1%;
                vertical-align: top;
            }

            .layout-card-title {
                color: #000 !important;
                font-size: 16px !important;
                font-weight: bold;
                margin-bottom: 8px;
                text-align: left;
                border-bottom: 2px solid #000;
                padding-bottom: 5px;
            }

            @page {
                margin: 1cm;
                size: A4 landscape;
            }
        }

        @media (max-width: 1100px) {
            .main-grid {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .side-panel {
                width: 100%;
                min-width: 100%;
                height: auto;
                overflow: visible;
                border: none;
                border-bottom: 1px solid var(--glass-border);
            }
            .center-panel {
                height: 500px;
                min-height: 500px;
            }
        }

        .rad-overflow {
            border-color: #FF3D00 !important;
            box-shadow: 0 0 15px rgba(255, 61, 0, 0.5) !important;
        }

        /* Matrix Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1A1F27;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .matrix-table {
            border-collapse: collapse;
            width: 100%;
            color: white;
            font-size: 13px;
            text-align: center;
        }

        .matrix-table th,
        .matrix-table td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
        }

        .matrix-table th {
            background: #2a323d;
            color: var(--kuka-orange);
            position: sticky;
            top: -20px;
            z-index: 10;
        }

        .matrix-cell {
            cursor: pointer;
            font-weight: 600;
        }

        .matrix-cell:hover {
            background: var(--kuka-orange) !important;
            color: black !important;
            position: relative;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .pal-1 {
            background: rgba(76, 175, 80, 0.15);
        }

        .pal-2 {
            background: rgba(3, 169, 244, 0.15);
        }
        
        /* Light Theme Overrides */
        body.light-theme {
            background-image: radial-gradient(circle at 50% 50%, #f1f5f9 0%, #e2e8f0 100%) !important;
            color: #1e293b !important;
        }
        
        body.light-theme .bg-[#1e1e1e]\/90,
        body.light-theme .bg-[#1e1e1e] {
            background-color: rgba(255, 255, 255, 0.95) !important;
            border-color: #cbd5e1 !important;
        }

        body.light-theme .bg-slate-900\/50,
        body.light-theme .bg-slate-900 {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
        }

        body.light-theme .text-[#cccccc],
        body.light-theme .text-[#cccccc],
        body.light-theme .text-[#cccccc] {
            color: #0f172a !important;
        }

        body.light-theme .text-[#cccccc] {
            color: #475569 !important;
        }

        body.light-theme .text-[#858585] {
            color: #64748b !important;
        }

        body.light-theme .border-[#3e3e42],
        body.light-theme .border-[#3e3e42] {
            border-color: #e2e8f0 !important;
        }

        body.light-theme .hover\:bg-slate-700:hover {
            background-color: #e2e8f0 !important;
        }
        
        body.light-theme .hover\:bg-slate-900\/80:hover {
            background-color: #f1f5f9 !important;
        }
        
        body.light-theme input,
        body.light-theme select {
            color: #0f172a !important;
        }
        
        body.light-theme .dizilim-btn.active,
        body.light-theme .mode-btn.active,
        body.light-theme .lang-btn.active {
            background-color: var(--kuka-orange) !important;
            color: white !important;
            border-color: var(--kuka-orange) !important;
        }

        body.light-theme .dizilim-btn,
        body.light-theme .mode-btn,
        body.light-theme .lang-btn {
            background-color: #ffffff !important;
            color: #475569 !important;
            border-color: #cbd5e1 !important;
        }
        
        body.light-theme .viz-header-content .text-[#569cd6] {
            color: #ea580c !important;
        }

        body.light-theme .panel-header {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(0,0,0,0.1) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important;
        }
        
        body.light-theme .stat-badge {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
    </style>
</head>

<body>
    <div class="w-screen h-screen bg-cad-bg overflow-hidden relative font-sans text-cad-text">
        
        <!-- Center Panel: Visualization (Moved to background) -->
        <div id="singleViewArea" class="absolute inset-0 z-0 flex flex-col items-center justify-center cursor-crosshair overflow-hidden" onmousedown="HmiApp.startPan(event)" ontouchstart="HmiApp.startPan(event)" onwheel="HmiApp.handleZoom(event)" ontouchmove="HmiApp.handleZoomTouch(event)">
            <!-- Background Grid Pattern -->
            

            <div class="panel-header" style="position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:30; background:var(--bg-surface); border: 1px solid var(--border-strong); padding: 6px 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius:0;">
                <div class="viz-header-content flex items-center justify-between gap-6">
                    <div class="text-[#569cd6] font-bold text-lg flex items-center gap-2"><i class="fas fa-cube"></i><span id="vizTitle">Dizilim 1...</span></div>
                    <div class="viz-stats flex gap-3">
                        <span class="stat-badge cursor-pointer bg-[#1e1e1e] hover:bg-slate-700 border border-[#3e3e42] rounded-none px-3 py-1 flex items-center gap-2 text-sm text-[#cccccc]" onclick="HmiApp.resetView()" title="Görünümü Sıfırla (Reset View)"><i class="fas fa-crosshairs text-[#569cd6]"></i><span>Sıfırla</span></span>
                        <span class="stat-badge bg-[#1e1e1e] border border-[#3e3e42] rounded-none px-3 py-1 flex items-center gap-2 text-sm text-[#cccccc]"><i class="fas fa-boxes text-[#569cd6]"></i><span id="statCount">10</span></span>
                        <span class="stat-badge bg-[#1e1e1e] border border-[#3e3e42] rounded-none px-3 py-1 flex items-center gap-2 text-sm text-[#cccccc]"><i class="fas fa-rotate text-[#569cd6]"></i><span id="statAngle">0°</span></span>
                    </div>
                </div>
            </div>

            <div class="pallet-area" id="palletArea" style="transform-origin: center center;">
                <div class="pallet" id="pallet"></div>
                <div class="pallet2" id="pallet2" style="display:none;"></div>
                <div class="center-mark" id="centerMark"></div>
            </div>

            <!-- ALL LAYOUTS VIEW CONTAINER -->
            <div class="all-layouts-grid" id="allLayoutsGrid"></div>
        </div>

        <div class="pointer-events-none absolute inset-0 z-40 mt-20 p-4 flex gap-4 overflow-hidden">
            <div id="mobileBackdrop" class="fixed inset-0 bg-black/60 z-[55] hidden sm:hidden pointer-events-auto" onclick="HmiApp.closeAllPanels()"></div>
            <!-- Left Panel: Controls -->
            <div id="leftPanel" class="pointer-events-auto w-[85vw] sm:w-[320px] h-full sm:h-screen overflow-y-auto bg-cad-panel border-r border-cad-border flex flex-col shrink-0 custom-scrollbar fixed top-0 left-0 z-[60] sm:z-40  transition-transform duration-300 translate-x-0" style="border-radius:0;">
                
                <!-- Toggle Button -->
                <button onclick="HmiApp.toggleLeftPanel()" class="absolute top-4 right-4 text-[#cccccc] hover:text-[#cccccc] z-50 hidden sm:block">
                    <i id="leftPanelIcon" class="fas fa-chevron-left"></i>
                </button>

                <div class="bg-[#2d2d30] hover:bg-[#3e3e42] border-b border-[#3e3e42] p-4 pr-10 flex items-center gap-2 font-bold text-sm uppercase tracking-wider text-[#cccccc]">
                    <i class="fas fa-sliders-h text-[#569cd6] text-base"></i><span id="lblControls" class="font-mono text-[11px] tracking-widest text-[#d4d4d4]">PROPERTIES INSPECTOR</span>
                </div>
                <div class="p-4 flex flex-col gap-4">
                    <div>
                        <label id="lblProject" class="block mb-1 text-xs font-semibold text-[#cccccc] uppercase tracking-wide">Proje</label>
                        <select id="projectSelect" onchange="HmiApp.selectProject()" class="w-full p-2.5 text-sm font-semibold bg-[#1e1e1e] border border-[#569cd6] rounded-none text-[#569cd6] cursor-pointer hover:border-[#569cd6] hover:bg-slate-900/80 focus:outline-none focus:border-[#569cd6] focus:ring-2 ">
                            <option value="24048" selected>24048 / 24049</option>
                            <option value="24050">24050</option>
                        </select>
                    </div>

                    <div>
                        <label id="lblWidth" class="block mb-1 text-xs font-semibold text-[#cccccc] uppercase tracking-wide">Genişlik (mm)</label>
                        <select id="inW" class="w-full p-2.5 text-sm font-semibold bg-[#1e1e1e] border border-[#569cd6] rounded-none text-[#569cd6] cursor-pointer hover:border-[#569cd6] hover:bg-slate-900/80 focus:outline-none focus:border-[#569cd6] focus:ring-2 ">
                            <option value="200">200</option>
                            <option value="300">300</option>
                            <option value="400">400</option>
                            <option value="500">500</option>
                            <option value="600">600</option>
                            <option value="900">900</option>
                        </select>
                    </div>

                    <div>
                        <label id="lblLength" class="block mb-1 text-xs font-semibold text-[#cccccc] uppercase tracking-wide">Uzunluk (mm)</label>
                        <select id="inL" class="w-full p-2.5 text-sm font-semibold bg-[#1e1e1e] border border-[#569cd6] rounded-none text-[#569cd6] cursor-pointer hover:border-[#569cd6] hover:bg-slate-900/80 focus:outline-none focus:border-[#569cd6] focus:ring-2 "></select>
                    </div>

                    <button id="btnCalc" onclick="HmiApp.calc()" class="w-full p-2 text-xs font-mono font-bold bg-[#007acc] text-white border border-[#007acc] hover:bg-[#005f9e] flex items-center justify-center gap-2"><i class="fas fa-calculator"></i><span id="lblCalc">Hesapla / Execute</span></button>

                    <div id="manualModeToggle" class="grid grid-cols-2 gap-2 mt-2 mode-selector">
                        <button id="btnAutoMode" onclick="HmiApp.toggleManualMode(false)" class="mode-btn active p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 hover:text-[#cccccc] flex items-center justify-center gap-2"><i class="fas fa-magic"></i> Auto</button>
                        <button id="btnManualMode" onclick="HmiApp.toggleManualMode(true)" class="mode-btn p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 hover:text-[#cccccc] flex items-center justify-center gap-2"><i class="fas fa-hand-paper"></i> Manual</button>
                    </div>

                    <div id="manualControlsGroup">
                        <div class="grid grid-cols-2 gap-3 mt-2">
                            <div>
                                <label id="lblGapW" class="block mb-1 text-xs font-semibold text-[#858585]">X Boşluk</label>
                                <input type="number" id="gapW" value="50" class="w-full p-2 text-sm font-bold font-mono text-center bg-[#1e1e1e] border border-[#569cd6] rounded-none text-[#569cd6] focus:outline-none focus:border-[#569cd6] focus:ring-2 ">
                            </div>
                            <div>
                                <label id="lblGapH" class="block mb-1 text-xs font-semibold text-[#858585]">Y Boşluk</label>
                                <input type="number" id="gapH" value="200" class="w-full p-2 text-sm font-bold font-mono text-center bg-[#1e1e1e] border border-[#569cd6] rounded-none text-[#569cd6] focus:outline-none focus:border-[#569cd6] focus:ring-2 ">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-2 mode-selector" id="palletModeSelector">
                            <button id="m1" onclick="HmiApp.setMode(0)" class="mode-btn active p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 hover:text-[#cccccc] flex items-center justify-center gap-2"><i class="fas fa-square"></i><span id="lbl1Pal">1 Palet</span></button>
                            <button id="m2" onclick="HmiApp.setMode(1)" class="mode-btn p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 hover:text-[#cccccc] flex items-center justify-center gap-2"><i class="fas fa-th"></i><span id="lbl2Pal">2 Palet</span></button>
                        </div>
                    </div>

                    <div id="exportToggle" class="grid grid-cols-2 gap-2 mt-2 mode-selector" style="display:none;">
                        <button id="btnDomestic" onclick="HmiApp.toggleExport(0)" class="mode-btn active p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 hover:text-[#cccccc] flex items-center justify-center gap-2"><i class="fas fa-home"></i><span id="lblDom">Domestic</span></button>
                        <button id="btnExport" onclick="HmiApp.toggleExport(1)" class="mode-btn p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 hover:text-[#cccccc] flex items-center justify-center gap-2"><i class="fas fa-ship"></i><span id="lblExp">Export</span></button>
                    </div>

                    <hr class="border-[#3e3e42] my-2">
                    
                    <div class="bg-[#1e1e1e] border border-[#3e3e42] rounded-none p-3">
                        <div class="text-xs font-bold text-[#569cd6] mb-2">Ölçü Görünürlüğü</div>
                        <div class="flex flex-col gap-2 text-xs text-[#cccccc]">
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="chkDimCenter" onchange="HmiApp.toggleDim('center', this.checked)" class="accent-orange-500"> Merkez Uzaklıkları</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="chkDimGap" onchange="HmiApp.toggleDim('gap', this.checked)" checked class="accent-orange-500"> Radyatörler Arası (Boşluk)</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="chkDimEdges" onchange="HmiApp.toggleDim('edges', this.checked)" class="accent-orange-500"> Palet & Kenar Ölçüleri</label>
                        </div>
                    </div>

                    <label id="lblLayout" class="block mt-2 mb-1 text-xs font-semibold text-[#cccccc] uppercase tracking-wide">Dizilim Şeması</label>

                    <div id="manualAddPanel" style="display:none;" class="bg-[#1e1e1e] border border-[#569cd6] rounded-none p-3 mb-2">
                        <div class="text-xs font-bold text-[#569cd6] mb-2">Radyatör Ekle (Manuel Mod)</div>
                        <div class="flex gap-2 mb-2">
                            <input type="number" id="manW" placeholder="Genişlik" class="w-full p-2 text-xs font-bold font-mono text-center bg-[#1e1e1e] border border-[#3e3e42] rounded-none text-[#569cd6] focus:outline-none focus:border-[#569cd6]">
                            <input type="number" id="manL" placeholder="Uzunluk" class="w-full p-2 text-xs font-bold font-mono text-center bg-[#1e1e1e] border border-[#3e3e42] rounded-none text-[#569cd6] focus:outline-none focus:border-[#569cd6]">
                        </div>
                        <button onclick="HmiApp.addManualRadiator()" class="w-full p-2 text-xs font-bold bg-[#569cd6] text-[#569cd6] border border-[#569cd6] rounded-none hover:bg-[#569cd6] flex items-center justify-center gap-2 mb-3"><i class="fas fa-plus"></i> Ekle</button>
                        
                        <div class="text-xs font-bold text-[#569cd6] mb-2 mt-2">Araçlar</div>
                        <button onclick="HmiApp.alignManualRadiators()" class="w-full p-2 text-xs font-bold rounded-none border border-[#3e3e42] bg-[#1e1e1e] text-[#cccccc] hover:bg-slate-700 flex items-center justify-center gap-2"><i class="fas fa-th-large"></i> Otomatik Hizala</button>

    <!-- Custom CAD UI Logic -->
    <script>
        function togglePanel(panelId, btnId) {
            const panel = document.getElementById(panelId);
            const btn = document.getElementById(btnId);
            const isLeft = panelId === 'leftPanel';

            if (panel.classList.contains(isLeft ? '-translate-x-full' : 'translate-x-full')) {
                // Open
                panel.classList.remove(isLeft ? '-translate-x-full' : 'translate-x-full');
                panel.classList.add('translate-x-0');
                btn.style.display = 'none';

                // Also handle mobile backdrop
                if (window.innerWidth < 640) {
                    document.getElementById('mobileBackdrop').classList.remove('hidden');
                }
            } else {
                // Close
                panel.classList.remove('translate-x-0');
                panel.classList.add(isLeft ? '-translate-x-full' : 'translate-x-full');

                setTimeout(() => {
                    btn.style.display = 'flex';
                }, 300);

                // Hide mobile backdrop if both panels are closed
                const otherPanel = document.getElementById(isLeft ? 'rightPanel' : 'leftPanel');
                if (otherPanel.classList.contains(isLeft ? 'translate-x-full' : '-translate-x-full')) {
                    document.getElementById('mobileBackdrop').classList.add('hidden');
                }
            }
        }

        // Initialize panels state based on screen size
        window.addEventListener('DOMContentLoaded', () => {
            // override HmiApp toggles if they exist to use our animation
            if(window.HmiApp) {
                window.HmiApp.toggleLeftPanel = () => togglePanel('leftPanel', 'btnOpenLeft');
                window.HmiApp.toggleRightPanel = () => togglePanel('rightPanel', 'btnOpenRight');
                window.HmiApp.closeAllPanels = () => {
                    const left = document.getElementById('leftPanel');
                    const right = document.getElementById('rightPanel');
                    if(left.classList.contains('translate-x-0')) togglePanel('leftPanel', 'btnOpenLeft');
                    if(right.classList.contains('translate-x-0')) togglePanel('rightPanel', 'btnOpenRight');
                    document.getElementById('mobileBackdrop').classList.add('hidden');
                };
            }

            if (window.innerWidth < 1024) {
                // Start closed on smaller screens
                document.getElementById('leftPanel').classList.add('-translate-x-full');
                document.getElementById('leftPanel').classList.remove('translate-x-0');

                document.getElementById('rightPanel').classList.add('translate-x-full');
                document.getElementById('rightPanel').classList.remove('translate-x-0');

                document.getElementById('btnOpenLeft').style.display = 'flex';
                document.getElementById('btnOpenRight').style.display = 'flex';
            } else {
                // Start open on desktop
                document.getElementById('btnOpenLeft').style.display = 'none';
                document.getElementById('btnOpenRight').style.display = 'none';
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                document.getElementById('leftPanel').classList.remove('-translate-x-full');
                document.getElementById('leftPanel').classList.add('translate-x-0');

                document.getElementById('rightPanel').classList.remove('translate-x-full');
                document.getElementById('rightPanel').classList.add('translate-x-0');

                document.getElementById('btnOpenLeft').style.display = 'none';
                document.getElementById('btnOpenRight').style.display = 'none';
                document.getElementById('mobileBackdrop').classList.add('hidden');
            }
        });
    </script>
