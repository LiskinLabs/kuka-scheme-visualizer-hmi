<!DOCTYPE HTML>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KUKA Cell Visualizer - CAD Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome (Latest) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- HTML2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Tailwind CSS (Latest via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cad: {
                            bg: '#121212',
                            panel: '#1e1e1e',
                            border: '#333333',
                            hover: '#2d2d2d',
                            text: '#e0e0e0',
                            muted: '#888888',
                            accent: '#FF6B2C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    borderRadius: {
                        sm: '2px',
                        DEFAULT: '2px',
                        md: '2px',
                        lg: '2px',
                        xl: '2px',
                        '2xl': '2px',
                        '3xl': '2px',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="kuka_design_system.css">
    <style>
        /* Devastating Print Styles */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body, html { background: white !important; margin: 0; padding: 0; color: black !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            * { box-shadow: none !important; transition: none !important; animation: none !important; }

            /* Hide UI Elements completely */
            #topBar, #leftPanel, #rightPanel, #toolbar, #schemes-tabs, #minimapContainer, .zoom-controls, .controls-container, #mobile-fab, #mobile-sheet { display: none !important; width: 0 !important; height: 0 !important; overflow: hidden !important; }

            #main-view { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; background: white !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; }

            /* Force CAD grid background off */
            .cad-grid-bg { background-image: none !important; background-color: white !important; }

            /* Radiator flat styling */
            div[class*="rad"], div[class*="radiator"] {
                background: white !important;
                background-color: white !important;
                background-image: none !important;
                border: 1px solid black !important;
                box-shadow: none !important;
                color: black !important;
                border-radius: 0 !important;
            }
            .radiator-top, .radiator-bottom, .radiator-grid, .rad-pattern { display: none !important; }

            /* Pallet flat styling */
            .pallet { border: 2px solid black !important; background: transparent !important; border-radius: 0 !important; }
            .pallet2 { border: 2px dashed black !important; background: transparent !important; border-radius: 0 !important; }

            /* Dimensions and text */
            .dim-line { border-color: black !important; background: transparent !important; }
            .dim-text { color: black !important; background: white !important; border: 1px solid white !important; font-weight: bold !important; }
            .center-mark, .center-x, .center-y { background: black !important; background-color: black !important; }

            /* Specification block */
            .print-data-block {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
                color: black !important;
                background: white !important;
                border: 2px solid black !important;
                box-shadow: none !important;
            }
            .print-data-block * { color: black !important; border-color: black !important; }

            /* Alignment fixes */
            #singleViewArea { position: absolute !important; inset: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; background: white !important; width: 100vw !important; height: 100vh !important; }
            #palletArea { transform-origin: center center !important; margin: 0 auto !important; position: relative !important; }
        }
</style>

    <style>
        @media print {
            .rad {
                background-color: #ffffff !important;
                background-image: none !important;
                border: 1px solid #000000 !important;
                box-shadow: none !important;
            }
            .rad::before, .rad::after {
                display: none !important;
            }
            .rad-24050 {
                background-color: #ffffff !important;
                background-image: none !important;
                border: 1px solid #000000 !important;
                box-shadow: none !important;
            }
            .dim-text, .dim-line, .center-mark {
                color: #000000 !important;
                border-color: #000000 !important;
                background-color: #ffffff !important;
            }
            .center-mark {
                background-color: #000000 !important;
            }
            .print-data-block {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
                color: #000000 !important;
                background-color: #ffffff !important;
            }
        }
    </style>
</head>

<body class="text-cad-text">

    <div id="app-container">
        
        <!-- Top Property Bar -->
        <div id="top-property-bar">
            <div class="flex items-center gap-2 text-cad-accent font-bold text-sm tracking-wider mr-4">
                <i class="fas fa-cube"></i> KUKA CAD
            </div>
            
            <div class="flex items-center gap-2">
                <label id="lblProject" class="text-xs text-cad-muted">Proj:</label>
                <select id="projectSelect" onchange="HmiApp.selectProject()" class="text-xs p-1 h-6">
                    <option value="24048" selected>24048/49</option>
                    <option value="24050">24050</option>
                </select>
            </div>

            <div class="flex items-center gap-2 ml-2">
                <label id="lblWidth" class="text-xs text-cad-muted">W(mm):</label>
                <select id="inW" class="text-xs p-1 h-6 w-16 text-center"></select>
            </div>

            <div class="flex items-center gap-2 ml-2">
                <label id="lblLength" class="text-xs text-cad-muted">L(mm):</label>
                <select id="inL" class="text-xs p-1 h-6 w-16 text-center"></select>
            </div>

            <button id="btnCalc" onclick="HmiApp.calc()" class="cad-btn text-xs px-3 h-6 ml-2 flex items-center gap-1 font-bold text-cad-accent border-cad-accent/50 hover:bg-cad-accent/10">
                <i class="fas fa-play text-[10px]"></i> <span id="lblCalc">CALC</span>
            </button>

            <!-- Status readouts -->
            <div class="flex-1"></div>
            <div class="flex items-center gap-4 text-xs font-mono text-cad-muted mr-2">
                <span title="Quantity" class="flex gap-1 items-center"><i class="fas fa-boxes text-[10px]"></i> <span id="statCount">0</span></span>
                <span title="Angle" class="flex gap-1 items-center"><i class="fas fa-rotate text-[10px]"></i> <span id="statAngle">0°</span></span>
                <span id="vizTitle" class="text-cad-accent hidden">Dizilim...</span>
            </div>

            <!-- Language Selectors (Moved to top right) -->
            <div class="flex gap-1 border border-[#333] rounded-sm bg-[#121212] p-0.5">
                <button id="btnRU" onclick="HmiApp.setLang('ru')" class="px-1.5 py-0.5 text-[9px] font-bold text-cad-muted hover:text-white rounded-sm">RU</button>
                <button id="btnTR" onclick="HmiApp.setLang('tr')" class="px-1.5 py-0.5 text-[9px] font-bold bg-[#FF6B2C] text-[#121212] rounded-sm">TR</button>
                <button id="btnUZ" onclick="HmiApp.setLang('uz')" class="px-1.5 py-0.5 text-[9px] font-bold text-cad-muted hover:text-white rounded-sm">UZ</button>
            </div>

            <!-- Sidebar toggle -->
            <button onclick="toggleSidebar()" class="tool-btn ml-2" title="Toggle Info Panel" style="margin-bottom:0; width: 24px; height: 24px;">
                <i id="sidebar-icon" class="fas fa-columns"></i>
            </button>
        </div>

        <!-- Left Toolbar (Vertical) -->
        <div id="left-toolbar">
            <!-- Modes -->
            <button id="btnAutoMode" onclick="HmiApp.toggleManualMode(false)" class="tool-btn active" title="Auto Mode"><i class="fas fa-magic text-xs"></i></button>
            <button id="btnManualMode" onclick="HmiApp.toggleManualMode(true)" class="tool-btn" title="Manual Mode"><i class="fas fa-hand-paper text-xs"></i></button>

            <div class="tool-separator"></div>

            <!-- Tools (Reset view) -->
            <button onclick="HmiApp.resetView()" class="tool-btn" title="Reset View / Fit"><i class="fas fa-crosshairs text-xs"></i></button>

            <div class="tool-separator"></div>

            <!-- Pallet / Export Modes (Dynamically shown/hidden by JS) -->
            <div id="palletModeSelector" class="flex flex-col gap-1 w-full px-1">
                <button id="m1" onclick="HmiApp.setMode(0)" class="cad-btn active text-[9px] py-1 text-center" title="1 Pallet">1P</button>
                <button id="m2" onclick="HmiApp.setMode(1)" class="cad-btn text-[9px] py-1 text-center" title="2 Pallet">2P</button>
            </div>

            <div id="exportToggle" class="flex flex-col gap-1 w-full px-1" style="display:none;">
                <button id="btnDomestic" onclick="HmiApp.toggleExport(0)" class="cad-btn active text-[9px] py-1 text-center" title="Domestic">DOM</button>
                <button id="btnExport" onclick="HmiApp.toggleExport(1)" class="cad-btn text-[9px] py-1 text-center" title="Export">EXP</button>
            </div>

            <div class="tool-separator"></div>

            <!-- Grid/Layout tools -->
            <button id="btnToggleAll" onclick="HmiApp.toggleAllLayouts()" class="tool-btn" title="Show All Layouts Grid"><i class="fas fa-th-large text-xs"></i><span id="lblToggleAll" class="hidden">Show All</span></button>
            <button id="btnMatrix" onclick="HmiApp.openMatrixModal()" class="tool-btn" title="Layout Matrix"><i class="fas fa-table text-xs"></i><span id="lblMatrix" class="hidden"></span></button>

            <div class="flex-grow"></div>

            <button onclick="window.print()" class="tool-btn" title="Print Layout"><i class="fas fa-print text-xs"></i><span id="lblPrint" class="hidden"></span></button>
            <button id="btnExportImg" onclick="HmiApp.exportToImage()" class="tool-btn" title="Download Image"><i class="fas fa-download text-xs"></i><span id="lblExportImg" class="hidden"></span></button>

            <!-- Hidden elements for legacy js compat -->
            <div class="hidden" id="manualModeToggle"></div>
        </div>

        <!-- Main View (Drawing Area + Tabs) -->
        <div id="main-view" class="cad-grid-bg">
            <!-- Drawing Area -->
            <div id="singleViewArea" class="flex-grow relative flex flex-col items-center justify-center cursor-move" onmousedown="HmiApp.startPan(event)" ontouchstart="HmiApp.startPan(event)" onwheel="HmiApp.handleZoom(event)" ontouchmove="HmiApp.handleZoomTouch(event)">

                <div class="pallet-area absolute border-none !bg-transparent !shadow-none !mt-0" id="palletArea" style="transform-origin: center center;">
                    <div class="pallet" id="pallet"></div>
                    <div class="pallet2" id="pallet2" style="display:none;"></div>
                    <div class="center-mark" id="centerMark"></div>
                </div>

                <!-- ALL LAYOUTS VIEW CONTAINER -->
                <div class="all-layouts-grid z-10 relative" id="allLayoutsGrid"></div>
            </div>

            <!-- Schemes Tabs Bar (D1-D12) -->
            <div id="schemes-tabs" class="dizilim-grid">
                <!-- Tabs generated dynamically or statically -->
                <div id="b1" onclick="HmiApp.selD(1)" class="scheme-tab dizilim-btn" style="display:none;">D1</div>
                <div id="b2" onclick="HmiApp.selD(2)" class="scheme-tab active dizilim-btn">D2</div>
                <div id="b3" onclick="HmiApp.selD(3)" class="scheme-tab dizilim-btn">D3</div>
                <div id="b4" onclick="HmiApp.selD(4)" class="scheme-tab dizilim-btn">D4</div>
                <div id="b5" onclick="HmiApp.selD(5)" class="scheme-tab dizilim-btn" style="display:none;">D5</div>
                <div id="b6" onclick="HmiApp.selD(6)" class="scheme-tab dizilim-btn">D6</div>
                <div id="b7" onclick="HmiApp.selD(7)" class="scheme-tab dizilim-btn">D7</div>
                <div id="b8" onclick="HmiApp.selD(8)" class="scheme-tab dizilim-btn">D8</div>
                <div id="b9" onclick="HmiApp.selD(9)" class="scheme-tab dizilim-btn">D9</div>
                <div id="b10" onclick="HmiApp.selD(10)" class="scheme-tab dizilim-btn">D10</div>
                <div id="b11" onclick="HmiApp.selD(11)" class="scheme-tab dizilim-btn">D11</div>
                <div id="b12" onclick="HmiApp.selD(12)" class="scheme-tab dizilim-btn">D12</div>
            </div>

            <!-- Minimap -->
            <div id="minimapContainer" class="hidden absolute bottom-12 right-4 z-40 w-32 h-24 bg-[#1e1e1e] border border-[#333] shadow-lg pointer-events-none overflow-hidden opacity-80">
                <div id="minimapView" class="absolute border border-[#FF6B2C] bg-[#FF6B2C]/20"></div>
            </div>
        </div>

        <!-- Right Sidebar (Properties & Details Accordion) -->
        <div id="right-sidebar" class="overflow-y-auto custom-scrollbar relative">

            <div class="p-3 border-b border-[#333] flex items-center gap-2">
                <i class="fas fa-sliders-h text-cad-accent"></i>
                <span class="text-xs font-bold uppercase tracking-widest text-cad-muted">Properties</span>
            </div>

            <!-- Parameters Accordion -->
            <div class="accordion">
                <!-- Radiator Params -->
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAcc(this)">
                        <span><i class="fas fa-box w-4"></i> <span id="lblRadiator">Radiator</span></span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform"></i>
                    </div>
                    <div class="accordion-content open">
                        <div class="kv-pair"><span class="kv-key" id="lblW2">Width:</span><span class="kv-val" id="iW">200 mm</span></div>
                        <div class="kv-pair"><span class="kv-key" id="lblL2">Length:</span><span class="kv-val" id="iL">500 mm</span></div>
                    </div>
                </div>

                <!-- Placement Params -->
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAcc(this)">
                        <span><i class="fas fa-layer-group w-4"></i> <span id="lblPlacement">Placement</span></span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform"></i>
                    </div>
                    <div class="accordion-content open">
                        <div class="kv-pair"><span class="kv-key" id="lblAngle">Angle:</span><span class="kv-val" id="iA">0°</span></div>
                        <div class="kv-pair"><span class="kv-key" id="lblPcs">Pcs/layer:</span><span class="kv-val" id="iC">10</span></div>
                        <div class="kv-pair ext-info-row"><span class="kv-key" id="lblLayers">Layers:</span><span class="kv-val" id="iLyr">10</span></div>
                        <div class="kv-pair ext-info-row"><span class="kv-key" id="lblTotal">Total:</span><span class="kv-val" id="iTot">100</span></div>
                    </div>
                </div>

                <!-- Pallet Params -->
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAcc(this)">
                        <span><i class="fas fa-pallet w-4"></i> <span id="lblPallet">Pallet</span></span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform"></i>
                    </div>
                    <div class="accordion-content open">
                        <div class="kv-pair"><span class="kv-key" id="lblPalSize">Size:</span><span class="kv-val" id="iP">1200x800</span></div>
                        <!-- Pallet Overrides -->
                        <div id="palletSizeControls" style="display:none;" class="mt-3 border-t border-[#333] pt-2">
                            <div class="text-[10px] text-cad-muted mb-1">Override Size:</div>
                            <div class="flex gap-2">
                                <input type="number" id="palW50" placeholder="W" class="w-full text-[10px] p-1 text-center">
                                <input type="number" id="palH50" placeholder="L" class="w-full text-[10px] p-1 text-center">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dimensions & View -->
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAcc(this)">
                        <span><i class="fas fa-ruler-combined w-4"></i> View / Dimensions</span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform"></i>
                    </div>
                    <div class="accordion-content open">
                        <div class="flex flex-col gap-2">
                            <label class="flex items-center gap-2 cursor-pointer text-xs text-cad-muted">
                                <input type="checkbox" id="chkDimCenter" onchange="HmiApp.toggleDim('center', this.checked)" class="accent-[#FF6B2C]"> Center Dims
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer text-xs text-cad-muted">
                                <input type="checkbox" id="chkDimGap" onchange="HmiApp.toggleDim('gap', this.checked)" checked class="accent-[#FF6B2C]"> Gap Dims
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer text-xs text-cad-muted">
                                <input type="checkbox" id="chkDimEdges" onchange="HmiApp.toggleDim('edges', this.checked)" class="accent-[#FF6B2C]"> Edge Dims
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Manual Mode Controls Group -->
                <div id="manualControlsGroup" class="accordion-item border-t border-cad-accent/30 mt-2">
                    <div class="accordion-header text-cad-accent" onclick="toggleAcc(this)">
                        <span><i class="fas fa-hand-paper w-4"></i> Manual Config</span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform"></i>
                    </div>
                    <div class="accordion-content open">
                        <div class="flex gap-2 mb-2">
                            <div class="flex-1">
                                <label id="lblGapW" class="text-[10px] text-cad-muted block mb-1">Gap X:</label>
                                <input type="number" id="gapW" value="50" class="w-full p-1 text-xs text-center">
                            </div>
                            <div class="flex-1">
                                <label id="lblGapH" class="text-[10px] text-cad-muted block mb-1">Gap Y:</label>
                                <input type="number" id="gapH" value="200" class="w-full p-1 text-xs text-center">
                            </div>
                        </div>

                        <div id="manualAddPanel" style="display:none;" class="border-t border-[#333] pt-2 mt-2">
                            <div class="text-[10px] text-cad-accent mb-1">Add Radiator:</div>
                            <div class="flex gap-2 mb-2">
                                <input type="number" id="manW" placeholder="W" class="w-full p-1 text-xs text-center">
                                <input type="number" id="manL" placeholder="L" class="w-full p-1 text-xs text-center">
                            </div>
                            <button onclick="HmiApp.addManualRadiator()" class="cad-btn w-full py-1 text-xs mb-2">Add <i class="fas fa-plus"></i></button>
                            <button onclick="HmiApp.alignManualRadiators()" class="cad-btn w-full py-1 text-xs">Auto Align <i class="fas fa-align-center"></i></button>
                        </div>

                        <div id="radPositionsPanel" style="display:none;" class="mt-2 text-[10px] overflow-x-auto"></div>
                        <div id="radPosResetBtn" style="display:none;" class="mt-2">
                            <button onclick="HmiApp.calc()" class="cad-btn w-full py-1 text-xs"><i class="fas fa-undo"></i> <span id="lblReset">Reset</span></button>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Mobile FAB -->
    <div id="mobile-fab" onclick="toggleBottomSheet()">
        <i class="fas fa-tools"></i>
    </div>

    <!-- Mobile Bottom Sheet -->
    <div id="mobile-sheet">
        <div class="sheet-handle" onclick="toggleBottomSheet()"></div>
        <div class="sheet-content">
            <!-- Content will be mirrored/moved here dynamically or handled via CSS depending on approach.
                 For simplicity, we replicate essential controls for mobile. -->
            <div class="flex items-center justify-between border-b border-[#333] pb-2">
                <span class="font-bold text-cad-accent">Tools & Properties</span>
                <button onclick="toggleBottomSheet()" class="text-cad-muted"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex flex-col gap-3">
                 <!-- Mobile clones of controls -->
                 <div class="flex gap-2">
                    <select id="m-projectSelect" onchange="document.getElementById('projectSelect').value=this.value; HmiApp.selectProject();" class="flex-1 p-2 text-sm">
                        <option value="24048">24048/49</option>
                        <option value="24050">24050</option>
                    </select>
                 </div>
                 <div class="flex gap-2">
                     <div class="flex-1"><label class="text-xs text-cad-muted">W(mm)</label><select id="m-inW" onchange="document.getElementById('inW').value=this.value; HmiApp.calc();" class="w-full p-2"></select></div>
                     <div class="flex-1"><label class="text-xs text-cad-muted">L(mm)</label><select id="m-inL" onchange="document.getElementById('inL').value=this.value; HmiApp.calc();" class="w-full p-2"></select></div>
                 </div>
                 <div class="flex gap-2">
                     <button onclick="HmiApp.toggleManualMode(false); toggleBottomSheet();" class="cad-btn flex-1 py-2 text-xs">Auto</button>
                     <button onclick="HmiApp.toggleManualMode(true); toggleBottomSheet();" class="cad-btn flex-1 py-2 text-xs">Manual</button>
                 </div>
                 <div class="flex gap-2">
                     <button onclick="HmiApp.toggleAllLayouts(); toggleBottomSheet();" class="cad-btn flex-1 py-2 text-xs">Grid View</button>
                     <button onclick="HmiApp.resetView(); toggleBottomSheet();" class="cad-btn flex-1 py-2 text-xs">Reset View</button>
                 </div>
            </div>
        </div>
    </div>


    <!-- Context Menu -->
    <div id="contextMenu" class="hidden absolute z-50 bg-[#1e1e1e] border border-[#333] shadow-lg p-1 text-xs" style="min-width: 120px;">
        <button id="ctxRotate" onclick="HmiApp.contextRotate()" class="w-full text-left px-3 py-2 hover:bg-[#2d2d2d] text-[#e0e0e0]"><i class="fas fa-sync-alt mr-2"></i>Rotate 90°</button>
        <button id="ctxDelete" onclick="HmiApp.contextDelete()" class="w-full text-left px-3 py-2 hover:bg-[#2d2d2d] text-red-400 mt-1"><i class="fas fa-trash mr-2"></i>Delete</button>
    </div>

    <!-- UI Interaction Scripts -->
    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const icon = document.getElementById('sidebar-icon');
            if(document.body.classList.contains('sidebar-collapsed')) {
                icon.className = 'fas fa-chevron-left';
            } else {
                icon.className = 'fas fa-columns';
            }
            // Trigger resize for canvas calculations
            setTimeout(() => window.dispatchEvent(new Event('resize')), 250);
        }

        function toggleAcc(el) {
            const content = el.nextElementSibling;
            const icon = el.querySelector('.fa-chevron-down, .fa-chevron-up');
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                if(icon) { icon.classList.remove('fa-chevron-up'); icon.classList.add('fa-chevron-down'); }
            } else {
                content.classList.add('open');
                if(icon) { icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-up'); }
            }
        }

        function toggleBottomSheet() {
            const sheet = document.getElementById('mobile-sheet');
            sheet.classList.toggle('open');

            // Sync mobile dropdowns with real ones
            if(sheet.classList.contains('open')) {
                const mW = document.getElementById('m-inW');
                const mL = document.getElementById('m-inL');
                if(mW.options.length === 0) {
                    mW.innerHTML = document.getElementById('inW').innerHTML;
                }
                if(mL.options.length === 0) {
                    mL.innerHTML = document.getElementById('inL').innerHTML;
                }
                mW.value = document.getElementById('inW').value;
                mL.value = document.getElementById('inL').value;
                document.getElementById('m-projectSelect').value = document.getElementById('projectSelect').value;
            }
        }

        // Override setup for width/lengths dynamically generated by JS
        document.addEventListener('DOMContentLoaded', () => {
             const originalInitLengths = HmiApp.initLengths;
             HmiApp.initLengths = function() {
                 originalInitLengths.call(HmiApp);
                 // Populate Widths too if not done by JS logic
                 const inW = document.getElementById('inW');
                 if(inW && inW.options.length === 0) {
                     const widths = [200, 300, 400, 500, 600, 900];
                     widths.forEach(w => {
                         const opt = document.createElement('option');
                         opt.value = w; opt.textContent = w;
                         inW.appendChild(opt);
                     });
                     inW.value = 200;
                 }

                 // Initial sync of tabs active state
                 HmiApp.updateDizilimActiveState = function() {
                    for (let i = 1; i <= 12; i++) {
                        const btn = this.dom.dizilimButtons[i];
                        if (btn) {
                            if (i === 1 || i === 5) { btn.style.display = 'none'; continue; }
                            if (i === this.state.dizilimId) {
                                btn.classList.add('active');
                            } else {
                                btn.classList.remove('active');
                            }
                            btn.textContent = `D${i}`; // Tabs only show D name for cleaner look
                        }
                    }
                    if (this.dom.modeButtons[0]) this.dom.modeButtons[0].classList.toggle('active', !this.state.isDualPallet);
                    if (this.dom.modeButtons[1]) this.dom.modeButtons[1].classList.toggle('active', this.state.isDualPallet);
                };
             };

             // Initial width population hack since it was hardcoded in old HTML
             const inW = document.getElementById('inW');
             if(inW) {
                 const widths = [200, 300, 400, 500, 600, 900];
                 widths.forEach(w => {
                     const opt = document.createElement('option');
                     opt.value = w; opt.textContent = w;
                     inW.appendChild(opt);
                 });
             }
        });

        // ============================================
        // OVERRIDE: ZOOM & PAN LOGIC (CAD PRO)
        // Corrects zoom to follow mouse cursor and clamps panning.
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Give production_metrics.js time to load
            setTimeout(() => {
                if (typeof HmiApp !== 'undefined') {

                    // Override the applyTransform to include clamping
                    const originalApplyTransform = HmiApp.applyTransform;
                    HmiApp.applyTransform = function() {
                        if (this.state.showAll && this.dom.allLayoutsGrid) {
                            // Infinite pan for Show All
                            this.dom.allLayoutsGrid.style.transform = `translate(${this.state.panX}px, ${this.state.panY}px) scale(${this.state.zoom})`;
                            this.dom.allLayoutsGrid.style.transformOrigin = '0 0';
                        } else {
                            originalApplyTransform.call(this);
                        }
                    };

                    // Override Zoom
                    const originalHandleZoom = HmiApp.handleZoom;
                    HmiApp.handleZoom = function(e) {
                        if (!this.state.showAll) {
                            originalHandleZoom.call(this, e);
                            return;
                        }

                        e.preventDefault();

                        // Smoother zoom multiplier instead of additive steps
                        const zoomFactor = 1.1;
                        let newZoom = this.state.zoom;

                        if (e.deltaY < 0) {
                            newZoom = Math.min(this.state.zoom * zoomFactor, 4);
                        } else {
                            newZoom = Math.max(this.state.zoom / zoomFactor, 0.15);
                        }

                        if (newZoom !== this.state.zoom) {
                            const rect = this.dom.singleViewArea.getBoundingClientRect();

                            // Get mouse position relative to container
                            const mouseX = e.clientX - rect.left;
                            const mouseY = e.clientY - rect.top;

                            // The formula to keep the point under the mouse stationary:
                            // We find the normalized coordinate of the mouse within the scaled content
                            const elementX = (mouseX - this.state.panX) / this.state.zoom;
                            const elementY = (mouseY - this.state.panY) / this.state.zoom;

                            this.state.zoom = newZoom;

                            // Reposition pan so the element point is still under the mouse
                            this.state.panX = mouseX - (elementX * this.state.zoom);
                            this.state.panY = mouseY - (elementY * this.state.zoom);

                            this.applyTransform();
                        }
                    };

                    // Override Pan to ensure bounds check applies during drag too
                    const originalStartPan = HmiApp.startPan;
                    HmiApp.startPan = function(e) {
                        if (!this.state.showAll) return;
                        const isTouch = e.type === 'touchstart';
                        if (isTouch && e.touches.length > 1) return;
                        if (!isTouch && e.button !== 1 && e.button !== 0) return;
                        if (e.target.closest('.rad') || e.target.closest('.rad-24050')) return;
                        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON') e.preventDefault();

                        let startX = isTouch ? e.touches[0].clientX : e.clientX;
                        let startY = isTouch ? e.touches[0].clientY : e.clientY;
                        let startPanX = this.state.panX, startPanY = this.state.panY;

                        const onMove = (ev) => {
                            let cx = isTouch ? ev.touches[0].clientX : ev.clientX;
                            let cy = isTouch ? ev.touches[0].clientY : ev.clientY;
                            this.state.panX = startPanX + (cx - startX);
                            this.state.panY = startPanY + (cy - startY);
                            this.applyTransform(); // Apply transform will clamp
                        };

                        const onUp = () => {
                            if (isTouch) {
                                this.state.lastZoomDist = null;
                                document.removeEventListener('touchmove', onMove);
                                document.removeEventListener('touchend', onUp);
                            } else {
                                document.removeEventListener('mousemove', onMove);
                                document.removeEventListener('mouseup', onUp);
                            }
                        };

                        if (isTouch) {
                            document.addEventListener('touchmove', onMove, { passive: false });
                            document.addEventListener('touchend', onUp);
                        } else {
                            document.addEventListener('mousemove', onMove);
                            document.addEventListener('mouseup', onUp);
                        }
                    };
                }
            }, 500); // Wait half a second for HmiApp to initialize

        });
    </script>

    <!-- External Dependencies & Logic -->
    <script src="production_metrics.js"></script>
